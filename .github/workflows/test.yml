name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
      - name: Install just
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL https://github.com/casey/just/releases/download/1.58.0/just-1.58.0-x86_64-unknown-linux-musl.tar.gz \
            | tar -xz -C "$HOME/.local/bin" just
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Start databases
        run: docker compose up -d --wait
      - name: Vet
        run: go vet ./...
      - name: Generated code is up to date
        run: go generate ./... && git diff --exit-code
      - name: Test (SQLite, Postgres, MySQL, MariaDB, DuckDB, ClickHouse, MongoDB, Qdrant)
        run: just test-all

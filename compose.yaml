# Test databases for the storm suite. Start them, then run the tests
# against each engine:
#
#   docker compose up -d --wait
#   just test-all        # sqlite + postgres + mysql + mariadb + duckdb
#                        # + clickhouse + mongo (+ atlas search) + qdrant
#
# Each engine gets two empty databases: "storm" (default connection) and
# "storm_audit" (the example's second connection).
name: storm
services:
  postgres:
    # pgvector's image (stock Postgres plus the vector extension) with
    # PostGIS added, so geometry columns and spatial indexes are tested.
    build:
      context: testdata/docker
      dockerfile: postgres.Dockerfile
    image: storm-postgres:pg17
    environment:
      POSTGRES_USER: storm
      POSTGRES_PASSWORD: storm
      POSTGRES_DB: storm
    ports: ["127.0.0.1:54329:5432"]
    volumes:
      - ./testdata/docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U storm -d storm_audit"]
      interval: 2s
      timeout: 5s
      retries: 30

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: storm
      MYSQL_USER: storm
      MYSQL_PASSWORD: storm
      MYSQL_DATABASE: storm
    ports: ["127.0.0.1:33069:3306"]
    volumes:
      - ./testdata/docker/mysql-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    tmpfs: [/var/lib/mysql]
    healthcheck:
      test: ["CMD-SHELL", "mysql -ustorm -pstorm -h127.0.0.1 -e 'SELECT 1' storm_audit"]
      interval: 2s
      timeout: 5s
      retries: 60

  mariadb:
    image: mariadb:11.8
    environment:
      MARIADB_ROOT_PASSWORD: storm
      MARIADB_USER: storm
      MARIADB_PASSWORD: storm
      MARIADB_DATABASE: storm
    ports: ["127.0.0.1:33070:3306"]
    volumes:
      - ./testdata/docker/mysql-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    tmpfs: [/var/lib/mysql]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      timeout: 5s
      retries: 60

  clickhouse:
    image: clickhouse/clickhouse-server:25.9-alpine
    environment:
      CLICKHOUSE_PASSWORD: storm
    volumes:
      - ./testdata/docker/clickhouse-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports: ["127.0.0.1:19000:9000", "127.0.0.1:18123:8123"]
    ulimits: { nofile: { soft: 262144, hard: 262144 } }
    tmpfs: [/var/lib/clickhouse]
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 2s
      timeout: 5s
      retries: 30

  mongo:
    # A single-node replica set: MongoDB has transactions only on replica
    # sets. The health check initiates it on first run.
    image: mongo:8
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports: ["127.0.0.1:17017:27017"]
    tmpfs: [/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "try { rs.status().ok } catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: '127.0.0.1:27017'}]}).ok }"]
      interval: 2s
      timeout: 5s
      retries: 30

  mongo-atlas:
    # MongoDB with its search engine (mongot), for vector search: plain
    # mongod has none. Used by the MongoDB vector search tests only.
    image: mongodb/mongodb-atlas-local:8.0
    ports: ["127.0.0.1:17018:27017"]
    healthcheck:
      test: ["CMD", "/usr/local/bin/runner", "healthcheck"]
      interval: 2s
      timeout: 30s
      start_period: 120s
      retries: 60

  qdrant:
    image: qdrant/qdrant:v1.15.1
    ports: ["127.0.0.1:16333:6333"]
    tmpfs: [/qdrant/storage]
